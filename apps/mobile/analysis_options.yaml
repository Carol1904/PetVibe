include: ../../analysis_options.yaml

analyzer:
  errors:
    avoid_dynamic_calls: ignore
  exclude:
    - "build/**"
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - ".dart_tool/**"

linter:
  rules:
    - use_key_in_widget_constructors
    - avoid_unnecessary_containers
    - sized_box_for_whitespace
    - use_colored_box
    - use_decorated_box
